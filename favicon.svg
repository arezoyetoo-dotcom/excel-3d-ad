<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B6FF2E"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#B6FF2E" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="#191C24" stroke="#23262F" stroke-width="2"/>
  
  <!-- 3D Isometric Spreadsheet Grid -->
  <path d="M 12 24 L 32 14 L 52 24 L 32 34 Z" fill="none" stroke="url(#gridGlow)" stroke-width="2.5" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M 12 24 L 12 40 L 32 50 L 32 34 Z" fill="rgba(182, 255, 46, 0.12)" stroke="#B6FF2E" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 52 24 L 52 40 L 32 50 L 32 34 Z" fill="rgba(35, 38, 47, 0.9)" stroke="#B6FF2E" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Grid Partition Lines -->
  <path d="M 22 19 L 42 29" stroke="#B6FF2E" stroke-width="1.5" opacity="0.8"/>
  <path d="M 22 29 L 22 45" stroke="#B6FF2E" stroke-width="1.5" opacity="0.6"/>
  <path d="M 42 29 L 42 45" stroke="#B6FF2E" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Glowing Center Data Dot -->
  <circle cx="32" cy="34" r="3" fill="#B6FF2E" filter="url(#shadow)"/>
</svg>
