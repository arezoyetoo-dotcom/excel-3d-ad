<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;

    }

      background: rgba(25, 28, 36, 0.9);

      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);

    .error-ref-badge {
      display: inline-block;

      font-size: 1.1rem;

      border-radius: 8px;
      margin-bottom: 20px;

    .error-code {
      font-size: 5rem;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1;
      margin-bottom: 14px;
      font-family: 'JetBrains Mono', monospace;
    }
    .error-code span {
      color: var(--brand-volt);
    }
    .error-text {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .error-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
