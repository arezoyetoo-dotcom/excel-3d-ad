<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11141A"/>
      <stop offset="50%" stop-color="#191C24"/>
      <stop offset="100%" stop-color="#23262F"/>
    </linearGradient>
    <linearGradient id="neonVolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B6FF2E"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#B6FF2E" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Matrix Grid Accent Overlay -->
  <g stroke="rgba(182, 255, 46, 0.07)" stroke-width="1.5">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Left Content Branding -->
  <g transform="translate(100, 110)">
    <!-- Security Badge -->
    <rect width="360" height="38" rx="8" fill="rgba(182, 255, 46, 0.12)" stroke="#B6FF2E" stroke-width="1.5"/>
    <text x="180" y="24" fill="#B6FF2E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1.5">
      ⚡ BESPOKE SPREADSHEET ARCHITECTURE
    </text>

    <!-- Main Title -->
    <text x="0" y="110" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">
      SheetFix 3D
    </text>
    <text x="0" y="175" fill="#B6FF2E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" filter="url(#glow)">
      We Fix Your Messy Excel Sheets
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="240" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">
      Formula Engineering • 24-Hour Turnaround • Zero Data Leakage
    </text>

    <!-- Pillars / Highlights -->
    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="#374151" stroke-width="1"/>
      <text x="90" y="26" fill="#F9FAFB" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">🛡️ Mutual NDA</text>

      <rect x="200" y="0" width="180" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="#374151" stroke-width="1"/>
      <text x="290" y="26" fill="#F9FAFB" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">🔒 SHA-256 Seal</text>

      <rect x="400" y="0" width="220" height="42" rx="8" fill="rgba(56, 189, 248, 0.1)" stroke="#38BDF8" stroke-width="1"/>
      <text x="510" y="26" fill="#38BDF8" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">✈️ Telegram @Shy1ohmy</text>
    </g>
  </g>

  <!-- Right Side: 3D Isometric Spreadsheet Graphic -->
  <g transform="translate(860, 290)">
    <!-- Base Isometric Plane -->
    <path d="M 0 -100 L 220 10 L 0 120 L -220 10 Z" fill="rgba(182, 255, 46, 0.08)" stroke="#B6FF2E" stroke-width="3" filter="url(#glow)"/>
    <path d="M -220 10 L -220 60 L 0 170 L 0 120 Z" fill="rgba(17, 20, 26, 0.8)" stroke="#B6FF2E" stroke-width="2"/>
    <path d="M 220 10 L 220 60 L 0 170 L 0 120 Z" fill="rgba(35, 38, 47, 0.9)" stroke="#B6FF2E" stroke-width="2"/>

    <!-- 3D Bar 1 -->
    <g transform="translate(-80, -20)">
      <path d="M 0 -70 L 35 -50 L 0 -30 L -35 -50 Z" fill="#B6FF2E"/>
      <path d="M -35 -50 L -35 20 L 0 40 L 0 -30 Z" fill="#84CC16"/>
      <path d="M 35 -50 L 35 20 L 0 40 L 0 -30 Z" fill="#4D7C0F"/>
    </g>

    <!-- 3D Bar 2 (High) -->
    <g transform="translate(0, -60)">
      <path d="M 0 -100 L 40 -78 L 0 -56 L -40 -78 Z" fill="#38BDF8" filter="url(#glow)"/>
      <path d="M -40 -78 L -40 20 L 0 42 L 0 -56 Z" fill="#0284C7"/>
      <path d="M 40 -78 L 40 20 L 0 42 L 0 -56 Z" fill="#0369A1"/>
    </g>

    <!-- 3D Bar 3 -->
    <g transform="translate(80, -10)">
      <path d="M 0 -50 L 35 -30 L 0 -10 L -35 -30 Z" fill="#B6FF2E"/>
      <path d="M -35 -30 L -35 20 L 0 40 L 0 -10 Z" fill="#84CC16"/>
      <path d="M 35 -30 L 35 20 L 0 40 L 0 -10 Z" fill="#4D7C0F"/>
    </g>
  </g>
</svg>
